      type: object
      required: [schemaName, tableName, columns, rows, total, page, pageSize]
      properties:
        schemaName: { type: string }
        tableName: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/DatabaseColumn" }
        rows:
          type: array
          items:
