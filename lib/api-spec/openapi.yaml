        recordCount: { type: integer }
        columns:
          type: array
          items: { $ref: "#/components/schemas/DatabaseColumn" }
    DatabaseCatalog:
      type: object
      required: [tables, refreshedAt]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/DatabaseTable" }
        refreshedAt: { type: string, format: date-time }
